services:

  # ── MySQL Database ──────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: catas_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=catas_db
      - MYSQL_USER=catas
      - MYSQL_PASSWORD=catas
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/DATABASE.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks:
      - catas_network
    restart: unless-stopped

  # ── API Server ──────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catas_server
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - WORKER_URL=http://catas_worker:8001
      - DATABASE_URL=mysql+pymysql://catas:catas@mysql:3306/catas_db
    volumes:
      - .:/app
    networks:
      - catas_network
    restart: unless-stopped
    depends_on:
      - mysql
      - worker

  # ── Worker (execução standalone — recebe tarefas via HTTP) ─
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: catas_worker
    expose:
      - "8001"
    env_file:
      - ./.env
    environment:
      - PYTHONPATH=/app/worker:/app
      - WORKER_PORT=8001
      - DATABASE_URL=mysql+pymysql://catas:catas@mysql:3306/catas_db
    restart: unless-stopped
    networks:
      - catas_network
    depends_on:
      - mysql

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "services.automation.scheduler"]
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=mysql+pymysql://catas:catas@mysql:3306/catas_db
      - WORKER_URL=http://catas_worker:8001
    networks:
      - catas_network
    restart: unless-stopped
    depends_on:
      - mysql
      - worker

volumes:
  mysql_data:

networks:
  catas_network:
    driver: bridge
